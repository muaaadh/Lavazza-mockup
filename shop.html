<!doctype html>
<html lang="en" data-base="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shop | Lavazza Maldives</title>
<meta name="description" content="Shop Lavazza capsules, coffee beans, ground coffee and machines in the Maldives. Filter by system, where you serve it, class and style. Demo site.">
<link rel="icon" href="assets/img/brand/favicon.svg">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/bricolage-grotesque-latin.woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
<script>document.documentElement.classList.add('js');setTimeout(function(){if(!window.LV_READY)document.documentElement.classList.remove('js')},4000)</script>
</head>
<body>

<main id="main">
  <div class="wrap page-head">
    <span class="eyebrow">Shop</span>
    <h1 class="display h-lg" id="shop-title">All coffee and machines</h1>
    <p class="lead" id="shop-lead">Everything in one place. Use the tabs for the kind of product and the filters on the left to narrow it down.</p>
  </div>

  <div class="shop-bar"><div class="wrap"><div class="shop-cats" id="cats" role="group" aria-label="Product type"></div></div></div>

  <div class="wrap shop-layout">
    <aside class="filters" id="filters" aria-label="Filters">
      <div class="filters-head"><h2 class="display h-sm">Filters</h2><button class="x" type="button" id="filters-x" aria-label="Close filters">&times;</button></div>
      <div id="fgroups"></div>
      <button class="btn filters-done" type="button" id="filters-done">Show products</button>
    </aside>
    <div>
      <div class="shop-top">
        <span class="count" id="count" role="status" aria-live="polite"></span>
        <div class="shop-tools">
          <button class="btn btn-light btn-sm filters-btn" type="button" id="filters-btn">Filters</button>
          <label class="sr" for="q">Search products</label>
          <input class="inp" type="search" id="q" placeholder="Search the shop" autocomplete="off">
          <label class="sr" for="sort">Sort by</label>
          <select class="inp" id="sort">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price, low to high</option>
            <option value="price-desc">Price, high to low</option>
            <option value="mild">Mildest first</option>
            <option value="bold">Strongest first</option>
            <option value="name">Name, A to Z</option>
          </select>
        </div>
      </div>
      <div class="active-chips" id="active"></div>
      <div class="grid shop-grid" id="grid"></div>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/brand.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/shop.js"></script>
</body>
</html>
